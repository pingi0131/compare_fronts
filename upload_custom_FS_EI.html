<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>FS' Compare & Metrics</title>
    <link rel="stylesheet" href="css/upload_custom_FS_EI.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        // 偵測是否為舊瀏覽器
        if (!window.Promise || !Array.prototype.find) {
            var s = document.createElement('script');
            s.src = 'https://polyfill.io/v3/polyfill.min.js?features=es6';
            s.defer = true;
            document.head.appendChild(s);
        }
    </script>
</head>

<body>
    <div class="main-content">
        <h1>多檔資金水位比較圖 指標</h1>
        
        <div class="range-controls">
            <label class="math-label">Days</label>
            <input type="number" id="minDay" placeholder="Min" step="1">
            <button class="reset-range-btn" onclick="resetField('minDay')"></button>
            <span class="tilde">-</span>
            <input type="number" id="maxDay" placeholder="Max" step="1">
            <button class="reset-range-btn" onclick="resetField('maxDay')"></button>
            &nbsp;&nbsp;
            
            <label class="math-label">FS</label>
            <input type="number" id="minFS" placeholder="Min" step="1000">
            <button class="reset-range-btn" onclick="resetField('minFS')"></button>
            <span class="tilde">-</span>
            <input type="number" id="maxFS" placeholder="Max" step="1000">
            <button class="reset-range-btn" onclick="resetField('maxFS')"></button>
            &nbsp;&nbsp;
            
            <button class="reset-allrange-btn" onclick="resetAllRanges()">All</button>
        </div>

        <div class="controls">
            <label for="csvFileInput">選擇 CSV 或 Excel 檔案：</label>
            <input type="file" id="csvFileInput" accept=".csv,.xlsx,.xls" multiple style="display: none;" />
            <button id="uploadBtn">選擇檔案</button>
            <span id="fileCount" style="margin-left: 10px; font-weight: bold; color: #000000;">目前有 0 個檔案</span>
            <button id="toggleListBtn" style="display: none;">收合列表</button>
        </div>

        <div id="fileListContainer" class="controls file-list-container"></div>
        <button id="resetColorsBtn" class="reset-btn" onclick="resetColors()" style="display: none;">重置所有顏色</button>
        <button id="downloadAllBtn" class="reset-btn" onclick="downloadAllDetailedCSV()" style="display: none; background-color: #28a745;">下載詳細指標 (.csv)</button>
        <button id="downloadCombinedDataBtn" class="reset-btn" onclick="downloadCombinedDataCSV()" style="display: none; background-color: #17a2b8;">下載合併數據 (.csv)</button>
        
        <div id="chart-container">
            <canvas id="fundsChart"></canvas>
        </div>

        <div id="metrics-container">
            <h2 style="font-family: 'Times New Roman'; text-align: center; color: #000;">Strategy Comparison Metrics</h2>
            <table id="metrics-table">
                <thead>
                    <tr id="table-header-row">
                        <th data-key="name">Name</th>
                        <th data-key="tr">Trend Ratio</th>
                        <th data-key="ei">Emotional Index</th>
                        <th data-key="flu">Daily Fluctuation</th>
                        <th data-key="mdd">MDD</th>
                        <th data-key="fs">Final FS</th>
                        <th data-key="roi">ROI</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <script src="js/upload_custom_FS_EI.js"></script>
</body>
</html>
